<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>המתכונים של תפארת</title>
<meta name="description" content="מתכוני המשפחה במקום אחד: מאפים, עוגות, ראשונות, סלטים, קינוחים ופסח – בשרי, חלבי ופרווה. אפשר גם לסרוק תמונות של מתכונים.">
<meta name="theme-color" content="#fde2e7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מתכונים">
<link rel="preload" href="fonts/rubik.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<a class="skip" href="#list">דילוג לרשימת המתכונים</a>
<header class="hero">
 <div class="wrap">
  <h1>המתכונים של תפארת 🧁</h1>
  <p><span id="heroCount">205</span> מתכונים של המשפחה – מהמחברת, מהחוברות, מהטלפון ומהסרטונים – במקום אחד</p>
  <div class="search" role="search" id="searchBox">
   <span class="ico" aria-hidden="true">🔍</span>
   <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="חיפוש מתכון או מצרך…" aria-label="חיפוש מתכון או מצרך" autocomplete="off">
   <button id="qx" type="button" aria-label="ניקוי החיפוש">✕</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="סינון לפי כשרות"></div>
  <div class="herobtns">
   <button class="add" id="bNew" type="button">➕ הוספת מתכון</button>
   <button class="photoadd" id="bScan" type="button">📸 הוספת מתכון מתמונה</button>
   <button id="bFind" type="button">🔎 חיפוש מתכון באינטרנט</button>
   <button id="bShare" type="button">📤 שיתוף</button>
   <button id="bMenu" type="button">⚙️ גיבוי והגדרות</button>
  </div>
 </div>
</header>
<main class="wrap">
 <div id="notices"></div>
 <h2 class="sec">קטגוריות</h2>
 <div class="tiles" id="tiles"></div>
 <section id="list" aria-live="polite">
  <div class="listhead"><h2 id="listTitle">כל המתכונים</h2>
   <span class="lhtools"><button class="clear" id="shareCat" type="button" hidden>📤 שיתוף הנושא</button><button class="clear" id="clear" type="button" hidden>ניקוי סינון</button>
    <label><span class="vh">מיון</span><select id="sort" class="sortsel"><option value="new">החדשים קודם</option><option value="az">לפי א–ב</option></select></label>
    <span class="count" id="count"></span></span></div>
  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden>לא נמצאו מתכונים 🙈 נסו מילה אחרת או נקו את הסינון</p>
 </section>
</main>
<footer>נבנה באהבה עבור תפארת והמשפחה · כל מתכון כולל את המקור שלו<div class="footlinks"><span id="countLine"></span></div></footer>

<div class="layer" id="layer" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="fFolder" webkitdirectory directory multiple hidden>
<input type="file" id="fFiles" accept="image/*" multiple hidden>
<input type="file" id="fPhoto" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<script src="app.js?v=3"></script>
</body>
</html>
